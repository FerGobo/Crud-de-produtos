<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cesta de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .box-container {
      max-width: 700px;
      margin: 60px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem 2rem 2rem;
    }
    .table thead th { color: #4285f4; }
  </style>
</head>
<body>
  <div class="box-container">
    <h4 class="mb-4 text-center" style="color:#4285f4">Cesta de Compras</h4>
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th scope="col">Nome</th>
          <th scope="col">Descrição</th>
          <th scope="col">Fornecedor</th>
          <th scope="col">Preço</th>
          <th scope="col">Ação</th>
        </tr>
      </thead>
      <tbody id="cestaTable">
        <!-- Produtos da cesta preenchidos via JS -->
      </tbody>
    </table>
    <div class="mt-3">
      <strong>Total de produtos:</strong> <span id="cestaQtd">0</span><br>
      <strong>Valor total:</strong> R$ <span id="cestaTotal">0.00</span>
    </div>
    <div class="mt-4 text-center">
      <a href="produtos.html" class="text-decoration-none">Voltar para Produtos</a>
    </div>
  </div>
  <script src="App/public/js/app.js"></script>
</body>
</html>
