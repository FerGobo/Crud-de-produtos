<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  <link rel="stylesheet" href="App/public/css/style.css">
</head>
<body>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .cadastro-container {
      max-width: 400px;
      margin: 60px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem 2rem 2rem;
    }
    .form-control:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 0.2rem rgba(66,133,244,.15);
    }
    .google-logo {
      width: 40px;
      margin-bottom: 10px;
    }
  </style>
  <div class="cadastro-container">
    <div class="text-center mb-4">
      <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_light_color_92x30dp.png" alt="Logo" class="google-logo">
      <h4 class="mt-2 mb-0" style="font-weight: 500; color: #4285f4">Mini Gestão de Produtos</h4>
      <small class="text-muted">Crie sua conta</small>
    </div>
    <form id="cadastroForm" autocomplete="off" novalidate>
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" required autofocus>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha" name="senha" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" style="background:#4285f4; border:none;">Cadastrar</button>
    </form>
    <div id="cadastroMsg" class="mt-3 text-center text-success"></div>
    <div class="mt-4 text-center">
      <a href="login.html" class="text-decoration-none">Já tem conta? Entrar</a>
    </div>
  </div>
  <script src="App/public/js/app.js"></script>
</body>
</html>
