<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Mini Gestão de Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f5f6fa;
    }
    .login-container {
      max-width: 400px;
      margin: 60px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem 2rem 2rem;
    }
    .form-control:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 0.2rem rgba(66,133,244,.15);
    }
    .btn-primary {
      background: #4285f4;
      border: none;
    }
    .btn-primary:hover {
      background: #2b6ed4;
    }
    .logo-img {
      height: 30px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="text-center mb-4">
      <h4 class="mt-2 mb-0" style="font-weight:500; color:#4285f4">Mini Gestão de Produtos</h4>
      <small class="text-muted">Acesse sua conta</small>
    </div>

    <!-- id="loginForm" sem method e sem action — o JS controla tudo -->
    <form id="loginForm" autocomplete="off">

      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" required autofocus>
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha" name="senha" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Entrar</button>

    </form>

    <!-- Mensagem de feedback do AJAX (erro ou carregando) -->
    <div id="loginMsg" class="mt-3 text-center"></div>

    <div class="mt-4 text-center">
      <a href="cadastro.html" class="text-decoration-none">Criar nova conta</a>
    </div>
  </div>

  <!-- app.js deve ser o ÚLTIMO script da página -->
  <script src="App/public/js/app.js"></script>

</body>
</html>
