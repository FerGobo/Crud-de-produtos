<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar Produto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .box-container {
      max-width: 500px;
      margin: 60px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem 2rem 2rem;
    }
    .form-control:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 0.2rem rgba(66,133,244,.15);
    }
  </style>
</head>
<body>
  <div class="box-container">
    <h4 class="mb-4 text-center" style="color:#4285f4">Cadastrar Produto</h4>
    <form id="produtoForm" autocomplete="off">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome do Produto</label>
        <input type="text" class="form-control" id="nome" name="nome" required>
      </div>
      <div class="mb-3">
        <label for="descricao" class="form-label">Descrição</label>
        <input type="text" class="form-control" id="descricao" name="descricao">
      </div>
      <div class="mb-3">
        <label for="preco" class="form-label">Preço</label>
        <input type="number" step="0.01" class="form-control" id="preco" name="preco" required>
      </div>
      <div class="mb-3">
        <label for="estoque" class="form-label">Estoque</label>
        <input type="number" class="form-control" id="estoque" name="estoque" required>
      </div>
      <div class="mb-3">
        <label for="fornecedor_id" class="form-label">Fornecedor</label>
        <select class="form-select" id="fornecedor_id" name="fornecedor_id" required>
          <option value="">Selecione...</option>
          <!-- Opções preenchidas via JS -->
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100" style="background:#4285f4; border:none;">Cadastrar Produto</button>
    </form>
    <div id="produtoMsg" class="mt-3 text-center text-success"></div>
    <div class="mt-4 text-center">
      <a href="produtos.html" class="text-decoration-none">Ver lista de produtos</a>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const select = document.getElementById('fornecedor_id');
      if (select) {
        fetch('/Back/ajax/ajax_fornecedores.php', {
          headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(res => res.json())
        .then(data => {
          if (data.ok && Array.isArray(data.fornecedores)) {
            select.innerHTML = '<option value="">Selecione...</option>' +
              data.fornecedores.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
          } else {
            select.innerHTML = '<option value="">Nenhum fornecedor cadastrado</option>';
          }
        })
        .catch(() => {
          select.innerHTML = '<option value="">Erro ao carregar fornecedores</option>';
        });
      }

      // Cadastro de produto AJAX
      const form = document.getElementById('produtoForm');
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          const nome = document.getElementById('nome').value.trim();
          const descricao = document.getElementById('descricao').value.trim();
          const preco = document.getElementById('preco').value;
          const estoque = document.getElementById('estoque').value;
          const fornecedor_id = document.getElementById('fornecedor_id').value;
          const msgEl = document.getElementById('produtoMsg');
          const btnEl = form.querySelector('button[type="submit"]');

          if (!nome || !preco || !estoque || !fornecedor_id) {
            msgEl.textContent = 'Preencha todos os campos obrigatórios.';
            msgEl.className = 'mt-3 text-center text-danger';
            return;
          }

          btnEl.disabled = true;
          btnEl.textContent = 'Salvando...';
          msgEl.textContent = '';

          fetch('/Back/ajax/ajax_produtos.php', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              'X-Requested-With': 'XMLHttpRequest'
            },
            body: 'acao=cadastrar'
              + '&nome=' + encodeURIComponent(nome)
              + '&descricao=' + encodeURIComponent(descricao)
              + '&preco=' + encodeURIComponent(preco)
              + '&estoque=' + encodeURIComponent(estoque)
              + '&fornecedor_id=' + encodeURIComponent(fornecedor_id)
          })
          .then(res => res.json())
          .then(data => {
            msgEl.textContent = data.msg;
            msgEl.className = 'mt-3 text-center text-' + (data.ok ? 'success' : 'danger');
            if (data.ok) form.reset();
            btnEl.disabled = false;
            btnEl.textContent = 'Cadastrar Produto';
          })
          .catch(() => {
            msgEl.textContent = 'Erro ao conectar ao servidor.';
            msgEl.className = 'mt-3 text-center text-danger';
            btnEl.disabled = false;
            btnEl.textContent = 'Cadastrar Produto';
          });
        });
      }
    });
  </script>
</body>
</html>
