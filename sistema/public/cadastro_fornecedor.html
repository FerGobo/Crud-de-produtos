<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar Fornecedor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .box-container {
      max-width: 500px;
      margin: 60px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem 2rem 2rem;
    }
    .form-control:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 0.2rem rgba(66,133,244,.15);
    }
  </style>
</head>
<body>
  <div class="box-container">
    <h4 class="mb-4 text-center" style="color:#4285f4">Cadastrar Fornecedor</h4>
    <form id="fornecedorForm" autocomplete="off">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome do Fornecedor</label>
        <input type="text" class="form-control" id="nome" name="nome" required>
      </div>
      <div class="mb-3">
        <label for="cnpj" class="form-label">CNPJ</label>
        <input type="text" class="form-control" id="cnpj" name="cnpj">
      </div>
      <div class="mb-3">
        <label for="telefone" class="form-label">Telefone</label>
        <input type="text" class="form-control" id="telefone" name="telefone">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email">
      </div>
      <button type="submit" class="btn btn-primary w-100" style="background:#4285f4; border:none;">Cadastrar Fornecedor</button>
    </form>
    <div id="fornecedorMsg" class="mt-3 text-center text-success"></div>
    <div class="mt-4 text-center">
      <a href="cadastro_produto.html" class="text-decoration-none">Cadastrar produto</a>
    </div>
  </div>
  <script src="App/public/js/app.js"></script>
</body>
</html>
