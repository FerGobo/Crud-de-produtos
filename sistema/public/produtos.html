<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .box-container {
      max-width: 1000px;
      margin: 40px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
    }
    .table thead th { color: #4285f4; }
    .nav-links { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .nav-links a {
      color: #4285f4;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #d0d9ff;
      transition: background 0.15s;
    }
    .nav-links a:hover { background: #f0f4ff; }
    .nav-links a.active { background: #4285f4; color: #fff; border-color: #4285f4; }
    .campo-editavel {
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 4px 8px;
      background: transparent;
      transition: border-color 0.2s, background 0.2s;
    }
    .campo-editavel:focus {
      outline: none;
      border-color: #4285f4;
      background: #f0f4ff;
    }
    .btn-salvar  { color: #4285f4; background: none; border: none; font-size: 1.1rem; cursor: pointer; }
    .btn-salvar:hover  { color: #1a5fe0; }
    .btn-excluir { color: #dc3545; background: none; border: none; font-size: 1.1rem; cursor: pointer; }
    .btn-excluir:hover { color: #a71d2a; }
  </style>
</head>
<body>
<div class="box-container">

  <!-- Menu de navegação -->
  <nav class="nav-links">
    <a href="produtos.html" class="active">Produtos</a>
    <a href="fornecedores.html">Fornecedores</a>
    <a href="cesta.html">Cesta</a>
    <a href="login.html">Sair</a>
  </nav>


  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0" style="color:#4285f4">Lista de Produtos</h4>
    <a href="cadastro_produto.html" class="btn btn-outline-primary btn-sm">+ Cadastrar Produto</a>
  </div>

  <form id="produtosForm">
    <!-- Barra de ações -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="text-muted small">Marque os produtos desejados e clique em "Adicionar à Cesta"</span>
      <button type="submit" class="btn btn-success btn-sm px-4">🛒 Adicionar à Cesta</button>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th scope="col"><input type="checkbox" id="checkAll"></th>
            <th scope="col">Nome</th>
            <th scope="col">Descrição</th>
            <th scope="col">Preço (R$)</th>
            <th scope="col">Estoque</th>
            <th scope="col">Fornecedor</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody id="produtosTable">
          <tr><td colspan="7" class="text-center text-muted">Carregando...</td></tr>
        </tbody>
      </table>
    </div>

    <div id="produtosMsg" class="mt-3 text-center"></div>
  </form>

  <div class="mt-4 text-center">
    <a href="cesta.html" class="text-decoration-none" style="color:#4285f4">Ver Cesta →</a>
  </div>

</div>
<script src="App/public/js/app.js"></script>
</body>
</html>
